[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunaNMR"
version = "1.0.0"
description = "Advanced NMR peak analysis and integration suite (PySide6/Qt)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Mas" }]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "lmfit>=1.3.4",
    "networkx>=2.5",
    "nmrglue>=0.9.0",
    "PySide6>=6.6.0",
    "numba>=0.57.0",
]

[project.scripts]
lunanmr = "lunaNMR.cli:main"

[tool.setuptools.packages.find]
include = ["lunaNMR*"]

[tool.pytest.ini_options]
filterwarnings = [
    # nmrglue's Tecmag reader builds 'a'-alias dtypes at import, which NumPy 2 deprecates.
    # A DeprecationWarning from a library is hidden outside a test runner by default.
    "ignore:Data type alias 'a' was deprecated:DeprecationWarning:nmrglue.fileio.tecmag",
]
